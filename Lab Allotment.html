<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Seating Plan</title>

<style>
* {
  box-sizing: border-box;
  font-family: Book Antiqua, Helvetica, sans-serif;
}

/* BODY */
body {
  margin: 0;
  background: #f1f3f6;
  min-height: 93vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: #1f3c88;
  color: white;
  text-align: center;
  padding: 12px 10px;
}

header h1 {
  font-size: 18px;
  margin: 0;
}

header p {
  font-size: 13px;
  margin: 4px 0 0;
  opacity: 0.9;
}

/* MAIN AREA */
.main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px 15px;
}

/* CARD */
.card {
  background: white;
  width: 100%;
  max-width: 600px;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  text-align: center;
}

/* TITLE */
.card h2 {
  text-align: center;
  font-size: 18px;
  margin-bottom: 16px;
}

/* INPUT */
input {
  width: 100%;
  padding: 11px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #bbb;
  margin-bottom: 6px;
}

input:focus {
  outline: none;
  border-color: #1f3c88;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  background: #1f3c88;
  color: white;
  cursor: pointer;
  margin-bottom: 16px;
}

button:hover {
  background: #162f6a;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

table, th, td {
  border: 1px solid #bbb;
}

th, td {
  padding: 8px 10px;
  text-align: center;
  font-size: 14px;
}

th {
  background-color: #1f3c88;
  color: white;
}

/* FOOTER */
footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  padding: 2px 0;   
  background: #f1f3f6;
}

#result p {
  margin: 0;
}
</style>
</head>

<body>

<header>
  <h1>MVJ College of Engineering (BITS-Examination)</h1>
  <p>Candidate Seating Plan Portal</p>
</header>

<div class="main">
  <div class="card">
    <h2>Search Candidate Details</h2>
    <p> Date-03-01-2025 Shift-FN </p>
    <input type="text" id="cid" placeholder="Enter Candidate ID">
    <button onclick="searchCandidate()">Search</button>

    <div id="result"></div>
  </div>
</div>

<footer>
  Powered by Keerthana and Team
</footer>

<script>
const data = {
  "2024AD05055": { name: "ALOK KUMAR OJHA", system: "1", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "24A", floor: "GND" },
  "2024AC05834": { name: "DEEPAK AGARWAL", system: "2", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "24A", floor: "GND" },
  "2024AC05940": { name: "NIKHILA", system: "3", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "24A", floor: "GND" },
  "2024AA05155": { name: "Ashwani Kumar Jaiswal", system: "4", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "24A", floor: "GND" },
  "2025AA05491": { name: "DEEPAK S", system: "5", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "24A", floor: "GND" }
  // add more candidates here...
};

function searchCandidate() {
  const input = document.getElementById("cid").value.trim().toUpperCase();
  const resultDiv = document.getElementById("result");

  if (input === "") {
    resultDiv.innerHTML = "<p>Please enter Candidate ID</p>";
    return;
  }

  if (data[input]) {
    const c = data[input];
    resultDiv.innerHTML = `
      <table>
        <tr>
          <th>Name</th>
          <th>System No</th>
          <th>Program</th>
          <th>Subprogram</th>
          <th>Lab No</th>
          <th>Floor</th>
        </tr>
        <tr>
          <td>${c.name}</td>
          <td>${c.system}</td>
          <td>${c.program}</td>
          <td>${c.subprogram}</td>
          <td>${c.lab}</td>
          <td>${c.floor}</td>
        </tr>
      </table>
    `;
  } else {
    resultDiv.innerHTML = "<p style='color:red;'>Candidate ID not found</p>";
  }
}
</script>

</body>
</html>
