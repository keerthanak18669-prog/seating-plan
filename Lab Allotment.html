<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Candidate Lab Attendance</title>
<style>
* { box-sizing: border-box; font-family: Book Antiqua, Helvetica, sans-serif; }

/* BODY */
body {
  margin: 0;
  background: #f1f3f6;
  min-height: 93vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: #1f3c88;
  color: white;
  text-align: center;
  padding: 12px 10px;
}

header h1 { font-size: 18px; margin: 0; }
header p { font-size: 13px; margin: 4px 0 0; opacity: 0.9; }

/* MAIN AREA */
.main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 30px 15px;
}

/* CARD */
.card {
  background: white;
  width: 100%;
  max-width: 900px;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  border: 1px solid #bbb;
  padding: 8px 10px;
  text-align: center;
  font-size: 14px;
}

th {
  background-color: #1f3c88;
  color: white;
}

input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  background: #1f3c88;
  color: white;
  cursor: pointer;
}

button:hover { background: #162f6a; }

footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  padding: 2px 0;   
  background: #f1f3f6;
}
</style>
</head>
<body>

</header>

// Populate table
const tbody = document.querySelector("#candidateTable tbody");
candidates.forEach(c => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${c.id}</td>
    <td>${c.name}</td>
    <td>${c.system}</td>
    <td>${c.program}</td>
    <td>${c.subprogram}</td>
    <td>${c.lab}</td>
    <td>${c.floor}</td>
    <td><input type="checkbox" class="present"></td>
  `;
  tbody.appendChild(tr);
});

// Save attendance (just logs the present candidates for now)
function saveAttendance() {
  const rows = document.querySelectorAll("#candidateTable tbody tr");
  const attendance = [];
  rows.forEach(row => {
    const id = row.cells[0].innerText;
    const present = row.querySelector(".present").checked;
    attendance.push({ id, present });
  });
  console.log("Attendance:", attendance);
  alert("Attendance saved! Check console for details.");
}
