}

  height: 18px;

button {

  background: #1f3c88;

}

button:hover {
  background: #162f6a;

footer {

  font-size: 12px;
  padding: 6px;

      id: row.cells[0].innerText,

      present: row.cells[7].querySelector("input").checked ? "Present" : "Absent"
    });
  });

  console.log(attendance);
  alert("Attendance saved. Open Console to see data.");
}
</script>
