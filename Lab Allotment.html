<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Lab Attendance</title>

<style>
* { box-sizing: border-box; font-family: Book Antiqua, Helvetica, sans-serif; }

body {
  margin: 0;
  background: #f1f3f6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: #1f3c88;
  color: white;
  text-align: center;
  padding: 12px;
}

.main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.card {
  background: white;
  width: 100%;
  max-width: 900px;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  border: 1px solid #bbb;
  padding: 8px;
  text-align: center;
}

th {
  background: #1f3c88;
  color: white;
}

button {
  margin-top: 15px;
  padding: 10px 20px;
  background: #1f3c88;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

footer {
  text-align: center;
  font-size: 12px;
  padding: 6px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h3>MVJ College of Engineering (BITS-Examination)</h3>
  <p>Candidate Lab Attendance Portal</p>
</header>

<div class="main">
  <div class="card">
    <h3>Lab Attendance – 24A (GND Floor)</h3>

    <table id="candidateTable">
      <thead>
        <tr>
          <th>Candidate ID</th>
          <th>Name</th>
          <th>System No</th>
          <th>Program</th>
          <th>Subprogram</th>
          <th>Lab</th>
          <th>Floor</th>
          <th>Present</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button onclick="saveAttendance()">Save Attendance</button>
  </div>
</div>

<footer>Powered by Keerthana and Team</footer>

<script>
const candidates = [
  {"id":"2024AD05055","name":"ALOK KUMAR OJHA","system":"1","program":"CLUSTER","subprogram":"EC2 M Mid Sem","lab":"24A","floor":"GND"},
  {"id":"2024AC05834","name":"DEEPAK AGARWAL","system":"2","program":"CLUSTER","subprogram":"EC2 M Mid Sem","lab":"24A","floor":"GND"},
  {"id":"2024AC05940","name":"NIKHILA","system":"3","program":"CLUSTER","subprogram":"EC2 M Mid Sem","lab":"24A","floor":"GND"},
  {"id":"2024AA05155","name":"Ashwani Kumar Jaiswal","system":"4","program":"CLUSTER","subprogram":"EC2 M Mid Sem","lab":"24A","floor":"GND"},
  {"id":"2024AA05484","name":"PERI A S RAJA SRIRAM","system":"30","program":"CLUSTER","subprogram":"EC2 M Mid Sem","lab":"24A","floor":"GND"}
];

// Populate table
const tbody = document.querySelector("#candidateTable tbody");

candidates.forEach(c => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${c.id}</td>
    <td>${c.name}</td>
    <td>${c.system}</td>
    <td>${c.program}</td>
    <td>${c.subprogram}</td>
    <td>${c.lab}</td>
    <td>${c.floor}</td>
    <td><input type="checkbox"></td>
  `;
  tbody.appendChild(tr);
});

// Save attendance
function saveAttendance() {
  const rows = document.querySelectorAll("#candidateTable tbody tr");
  const data = [];

  rows.forEach(row => {
    data.push({
      id: row.cells[0].innerText,
      present: row.cells[7].querySelector("input").checked
    });
  });

  console.log(data);
  alert("Attendance saved. Check console.");
}
</script>

</body>
</html>
