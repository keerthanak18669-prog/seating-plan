<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Seating Info</title>

<style>
  body {
    margin: 0;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #f0f7ff, #ffffff);
    color: #1f2937;
  }

  .container {
    max-width: 720px;
    margin: 80px auto;
    padding: 0 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #1e40af;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 15px;
    color: #475569;
  }

  /* Search box */
  .search-box {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .search-box input {
    flex: 1;
    max-width: 360px;
    padding: 14px 16px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid #c7d2fe;
    outline: none;
    background: #ffffff;
  }

  .search-box input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .search-box button {
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .search-box button:hover {
    background: #1d4ed8;
  }

  /* Result section */
  .result {
    background: #ffffff;
    border-radius: 14px;
    padding: 24px 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  }

  .result h2 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #0f172a;
  }

  .info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 14px;
    column-gap: 30px;
    font-size: 15px;
  }

  .label {
    color: #64748b;
  }

  .value {
    font-weight: 600;
    color: #020617;
  }

  .highlight {
    grid-column: span 2;
    margin-top: 18px;
    padding: 14px;
    background: #f0fdf4;
    border-left: 5px solid #22c55e;
    border-radius: 8px;
    font-weight: 600;
    color: #166534;
  }

  .not-found {
    background: #fff1f2;
    border-left: 5px solid #ef4444;
    padding: 16px;
    border-radius: 10px;
    color: #7f1d1d;
    font-weight: 500;
  }
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Find Your Exam Seat</h1>
    <p>Enter your Website ID to instantly view your exam location</p>
  </div>

  <div class="search-box">
    <input type="text" id="websiteId" placeholder="Enter Website ID (eg: WEB20260045)">
    <button onclick="getDetails()">Search</button>
  </div>

  <div id="output"></div>

</div>

<script>
  const seatingData = {
    "WEB20260045": {
      name: "Keerthana K",
      block: "Admin Block",
      floor: "1st Floor",
      lab: "Computer Lab – II",
      room: "Room No. 13",
      seat: "Seat No. 32"
    },
    "WEB20260052": {
      name: "Rahul S",
      block: "Admin Block",
      floor: "1st Floor",
      lab: "Computer Lab – I",
      room: "Room No. 11",
      seat: "Seat No. 18"
    }
  };

  function getDetails() {
    const id = document.getElementById("websiteId").value.trim();
    const out = document.getElementById("output");

    if (!seatingData[id]) {
      out.innerHTML = `
        <div class="not-found">
          ❌ No details found. Please check your Website ID.
        </div>`;
      return;
    }

    const d = seatingData[id];

    out.innerHTML = `
      <div class="result">
        <h2>Hello, ${d.name} 👋</h2>

        <div class="info">
          <div class="label">Block</div><div class="value">${d.block}</div>
          <div class="label">Floor</div><div class="value">${d.floor}</div>
          <div class="label">Lab</div><div class="value">${d.lab}</div>
          <div class="label">Room Number</div><div class="value">${d.room}</div>
          <div class="label">Seat Number</div><div class="value">${d.seat}</div>

          <div class="highlight">
            📍 Please reach ${d.block}, ${d.floor}, ${d.room} at least 30 minutes early.
          </div>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
