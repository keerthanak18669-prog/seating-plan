<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Seating Info</title>

<style>
  body {
    margin: 0;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #f0f7ff, #ffffff);
    color: #1f2937;
  }

  .container {
    max-width: 720px;
    margin: 80px auto;
    padding: 0 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #1e40af;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 15px;
    color: #475569;
  }

  /* Search box */
  .search-box {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .search-box input {
    flex: 1;
    max-width: 360px;
    padding: 14px 16px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid #c7d2fe;
    outline: none;
    background: #ffffff;
  }

  .search-box input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .search-box button {
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .search-box button:hover {
    background: #1d4ed8;
  }

  /* Result section */
  .result {
    background: #ffffff;
    border-radius: 14px;
    padding: 24px 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  }

  .result h2 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #0f172a;
  }

  .info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 14px;
    column-gap: 30px;
    font-size: 15px;
  }

  .label {
    color: #64748b;
  }

  .value {
    font-weight: 600;
    color: #020617;
  }

    grid-column: span 2;
    margin-top: 18px;
    padding: 14px;
