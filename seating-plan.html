<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System & Lab Allotment</title>

<style>
/* RESET */
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

/* BODY */
body {
  margin: 0;
  min-height: 100vh;
  background: #f4f6f9;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: #1e3a8a;
  color: white;
  text-align: center;
  padding: 20px 15px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin-top: 6px;
  font-size: 14px;
  opacity: 0.9;
}

/* MAIN */
main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* CARD */
.card {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 28px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  text-align: center;
}

.card h2 {
  margin-bottom: 18px;
  font-size: 18px;
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 8px;
  outline: none;
}

input:focus {
  border-color: #1e3a8a;
}

/* HINT */
.hint {
  font-size: 12px;
  color: #666;
  margin-bottom: 15px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  font-size: 15px;
  border: none;
  border-radius: 8px;
  background: #1e3a8a;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #16307a;
}

button:active {
  transform: scale(0.97);
}

/* RESULT */
#result {
  margin-top: 18px;
  font-size: 15px;
  line-height: 1.6;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 12px;
  font-size: 13px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>MVJ College of Engineering</h1>
  <p>Candiadte Seating Plan</p>
</header>

<main>
  <div class="card">
    <h2>Search Candidate Details</h2>

    <input type="text" id="cid" placeholder="Enter Candidate ID">

    <div class="hint">Case insensitive (small / caps both work)</div>

    <button onclick="check()">Search</button>

    <div id="result"></div>
  </div>
</main>

<footer>
  Powered by Keerthana and Team
</footer>

<script>
/* SAMPLE DATA */
const data = {
 "2024AC05073": { name: "KARTIKEYA DUBEY", system: "270", lab: "228", floor: "2nd" },

};

/* SEARCH FUNCTION */
function check() {
  const input = document.getElementById("cid").value.trim().toUpperCase();
  const result = document.getElementById("result");

  if (input === "") {
    result.innerHTML = "<span style='color:red;'>Please enter Candidate ID</span>";
    return;
  }

  if (data[input]) {
    result.innerHTML = `
      <strong>Lab:</strong> ${data[input].lab}<br>
      <strong>System:</strong> ${data[input].system}
    `;
  } else {
    result.innerHTML = "<span style='color:red;'>No record found</span>";
  }
}
</script>

</body>
</html>
