<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidate Seating Plan</title>

<style>
* {
  box-sizing: border-box;
}

/* Logo */
.logo {
  width: 240px;
  margin-bottom: 20px;
}

body {
  margin: 0;
  padding: 0;
  min-height: 92vh;

  background-image: url("images/bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  font-family: "Book Antiqua", Georgia, serif;

  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  width: 90vw;
  max-width: 380px;
  padding: 28px 22px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  text-align: center;
  transform: translateY(-40px);
}

h1 {
  font-size: 20px;
}

h2 {
  font-size: 18px;
  margin-bottom: 16px;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  margin-bottom: 8px;
  border-radius: 8px;
  border: 1px solid #bbb;
}

.hint {
  font-size: 13px;
  color: #666;
  margin-bottom: 14px;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  background: #2e7d32;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

#result {
  margin-top: 18px;
  font-size: 16px;
  line-height: 1.7;
}

.footer {
  font-size: 12px;
  color: #777;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="card">
  <img src="images/logo.png" class="logo">

  <h1>MVJ College Of Engineering (BITS-Examination)</h1>
  <h2>Candidate Seating Plan</h2>

  <input type="text" id="cid" placeholder="Enter Candidate ID">
  <p class="hint">Enter Candidate ID (Case insensitive)</p>

  <button onclick="check()">Search</button>

  <div id="result"></div>

  <p class="footer">Powered by Keerthana and team</p>
</div>

<script>
function check() {
  const id = document.getElementById("cid").value.trim().toUpperCase();
  const data = {
    "2025CA08029": {
      name: "VAIBHAV BHASKAR",
      system: "16",
      lab: "24A",
      floor: "GND"
    }
  };

  const res = document.getElementById("result");

  if (data[id]) {
    res.innerHTML = `
      <b>Name:</b> ${data[id].name}<br>
      <b>System No:</b> ${data[id].system}<br>
      <b>Lab:</b> ${data[id].lab}<br>
      <b>Floor:</b> ${data[id].floor}
    `;
  } else {
    res.innerHTML = "❌ Candidate ID not found";
  }
}
</script>

</body>
</html>
