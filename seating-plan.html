<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Seating Information</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f8ff; /* soft positive background */
    color: #1f2937;
    margin: 40px;
  }

  h1 {
    font-size: 22px;
    color: #1d4ed8; /* calm blue */
    margin-bottom: 24px;
  }

  label {
    font-size: 14px;
    font-weight: 600;
  }

  input {
    font-size: 14px;
    padding: 8px;
    width: 280px;
    border: 1px solid #c7d2fe;
    border-radius: 4px;
    outline: none;
  }

  input:focus {
    border-color: #2563eb;
  }

  button {
    font-size: 14px;
    padding: 8px 16px;
    margin-left: 8px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: #1d4ed8;
  }

  .result {
    margin-top: 32px;
    font-size: 15px;
    line-height: 1.9;
  }

  .result-title {
    font-weight: 600;
    color: #065f46;
    margin-bottom: 12px;
  }

  .highlight {
    color: #047857;
    font-weight: 600;
  }

  .not-found {
    color: #b91c1c;
    font-weight: 500;
  }
</style>
</head>

<body>

<h1>Exam Seating Information</h1>

<label for="websiteId">Website ID</label><br><br>
<input type="text" id="websiteId" placeholder="Enter your Website ID">
<button onclick="getDetails()">View Details</button>

<div class="result" id="result"></div>

<script>
  const seatingData = {
    "WEB20260045": {
      name: "Keerthana K",
      block: "Admin Block",
      floor: "1st Floor",
      lab: "Computer Lab – II",
      room: "Room No. 13",
      seat: "Seat No. 32"
    },
    "WEB20260052": {
      name: "Rahul S",
      block: "Admin Block",
      floor: "1st Floor",
      lab: "Computer Lab – I",
      room: "Room No. 11",
      seat: "Seat No. 18"
    }
  };

  function getDetails() {
    const id = document.getElementById("websiteId").value.trim();
    const resultDiv = document.getElementById("result");

    if (!seatingData[id]) {
      resultDiv.innerHTML = `
        <div class="not-found">
          Seating details not found. Please check your Website ID.
        </div>`;
      return;
    }

    const d = seatingData[id];

    resultDiv.innerHTML = `
      <div class="result-title">Your Seating Details</div>
      Name : <span class="highlight">${d.name}</span><br>
      Block : ${d.block}<br>
      Floor : ${d.floor}<br>
      Lab : ${d.lab}<br>
      Room Number : <span class="highlight">${d.room}</span><br>
      Seat Number : <span class="highlight">${d.seat}</span>
    `;
  }
</script>

</body>
</html>
