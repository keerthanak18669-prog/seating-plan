<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Seating Plan</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* BODY */
body {
  margin: 0;
  background: #f1f3f6;
  min-height: 92vh;
}

/* HEADER */
header {
  background: #1f3c88;
  color: white;
  text-align: center;
  padding: 12px 10px;
}

header h1 {
  font-size: 18px;
  margin: 0;
}

header p {
  font-size: 13px;
  margin: 4px 0 0;
  opacity: 0.9;
}

/* MAIN AREA */
.main {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px 15px;
}

/* CARD */
.card {
  background: white;
  width: 100%;
  max-width: 380px;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

/* TITLE */
.card h2 {
  text-align: center;
  font-size: 17px;
  margin-bottom: 16px;
}

/* INPUT */
input {
  width: 100%;
  padding: 11px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #bbb;
  margin-bottom: 6px;
}

input:focus {
  outline: none;
  border-color: #1f3c88;
}

/* HINT */
.hint {
  font-size: 11px;
  color: #666;
  text-align: center;
  margin-bottom: 14px;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  background: #1f3c88;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #162f6a;
}

/* RESULT */
#result {
  margin-top: 16px;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}

/* FOOTER */
footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  padding: 6px 0;
  margin-top: -10px; 
}
</style>
</head>

<body>

<header>
  <h1>MVJ College of Engineering(BITS-Examination</h1>
  <p>Candidate Seating Plan Portal</p>
</header>

<div class="main">
  <div class="card">
    <h2>Search Candidate Details</h2>
    <h2> Shift-FN </h2> <h2> Date-03-01-2025</h2>
    <input type="text" id="cid" placeholder="Enter Candidate ID">


    <button onclick="searchCandidate()">Search</button>

    <div id="result"></div>
  </div>
</div>

<footer>
  Powered by Keerthana and Team
</footer>

<script>
const data = {
  "2024AC05073": { name: "KARTIKEYA DUBEY", system: "270", lab: "228", floor: "2nd" },
};

function searchCandidate() {
  const input = document.getElementById("cid").value.trim().toUpperCase();
  const result = document.getElementById("result");

  if (!input) {
    result.innerHTML = "<span style='color:red;'>Please enter Candidate ID</span>";
    return;
  }

  if (data[input]) {
    result.innerHTML = `
      <strong>Lab:</strong> ${data[input].lab}<br>
      <strong>System:</strong> ${data[input].system}
    `;
  } else {
    result.innerHTML = "<span style='color:red;'>No record found</span>";
  }
}
</script>

</body>
</html>
