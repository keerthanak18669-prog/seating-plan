<style>
	@keyframes shake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

.shake {
  animation: shake 0.4s;
}

* {
  box-sizing: border-box;
  font-family: Book Antiqua, Helvetica, sans-serif;
}

.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
}

.logo-wrap img {
  width: 100px;
  height: auto;
}

/* BODY */
body {
  margin: 0;
  background: #f1f3f6;
  min-height: 90vh;

  display: flex;
  flex-direction: column;
}


/* HEADER */
header {
  background: #1f3c88;
  color: white;
  text-align: center;
  padding: 12px 10px;
}

header h1 {
  font-size: 18px;
  margin: 0;
}

header p {
  font-size: 13px;
  margin: 4px 0 0;
  opacity: 0.9;
}

/* MAIN AREA */
.main {
  flex: 1; /* THIS pushes footer down */
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px 15px;
}


/* CARD */
.card {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 28px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  text-align: center;
}

/* TITLE */
.card h2 {
  text-align: center;
  font-size: 18px;
  margin-bottom: 16px;
}

/* INPUT */
input {
  width: 100%;
  padding: 11px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #bbb;
  margin-bottom: 6px;
}

input:focus {
  outline: none;
  border-color: #1f3c88;
}

/* BUTTON */
button {
  width: 100%;
  padding: 10px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  background: #1f3c88;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #162f6a;
}

/* RESULT */
#result {
  margin-top: 16px;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}

/* FOOTER */
footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  padding: 0px 0;   
  background: #f1f3f6;
}

</style>
</head>
