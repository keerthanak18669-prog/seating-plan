<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Seating Arrangement</title>

<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #000;
    margin: 32px;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 6px;
    font-weight: bold;
  }

  .meta {
    font-size: 13px;
    margin-bottom: 24px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    border-bottom: 2px solid #000;
    padding: 6px;
    text-align: left;
  }

  tbody td {
    border-bottom: 1px solid #000;
    padding: 6px;
    vertical-align: top;
  }

  .row-label {
    font-weight: bold;
    width: 60px;
  }

  .seat {
    white-space: nowrap;
  }

  .seat span {
    display: block;
  }

  .seat-number {
    font-weight: bold;
  }

  .empty {
    color: #555;
  }

  .blocked {
    color: #000;
    font-style: italic;
  }

  /* Print perfection */
  @media print {
    body {
      margin: 0;
    }
  }
</style>
</head>

<body>

<h1>Exam Seating Arrangement</h1>
<div class="meta">
  Hall: A Block – Room 203<br>
  Date: 12 Mar 2026 | Session: FN
</div>

<table>
  <thead>
    <tr>
      <th>Row</th>
      <th>Seat 1</th>
      <th>Seat 2</th>
      <th>Seat 3</th>
      <th>Seat 4</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td class="row-label">A</td>
      <td class="seat">
        <span class="seat-number">A1</span>
        <span>Keerthana K</span>
        <span>21CS045</span>
      </td>
      <td class="seat empty">EMPTY</td>
      <td class="seat">
        <span class="seat-number">A3</span>
        <span>Rahul S</span>
        <span>21CS052</span>
      </td>
      <td class="seat blocked">BLOCKED</td>
    </tr>

    <tr>
      <td class="row-label">B</td>
      <td class="seat">
        <span class="seat-number">B1</span>
        <span>Ananya M</span>
        <span>21CS061</span>
      </td>
      <td class="seat empty">EMPTY</td>
      <td class="seat">
        <span class="seat-number">B3</span>
        <span>Vikram R</span>
        <span>21CS074</span>
      </td>
      <td class="seat empty">EMPTY</td>
    </tr>
  </tbody>
</table>

</body>
</html>
