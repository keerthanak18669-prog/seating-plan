<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Seating Details</title>

<style>
  body {
    margin: 0;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #eef4ff, #ffffff);
    min-height: 100vh;
    color: #1f2937;
  }

  .wrapper {
    max-width: 480px;
    margin: auto;
    padding: 24px 16px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    color: #1e40af;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 24px;
  }

  .search {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .search input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #c7d2fe;
    font-size: 14px;
    outline: none;
  }

  .search input:focus {
    border-color: #2563eb;
  }

  .search button {
    padding: 14px 18px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  .search button:hover {
    background: #1d4ed8;
  }

  .details {
    margin-top: 8px;
  }

  .student-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    color: #020617;
  }

  .line {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
  }

  .line span {
    color: #6b7280;
  }

  .line strong {
    color: #020617;
  }

  .highlight {
    margin-top: 18px;
    padding: 14px;
    background: #ecfdf5;
    color: #166534;
    font-weight: 600;
    border-radius: 10px;
    font-size: 14px;
  }

  .error {
    padding: 14px;
    background: #fff1f2;
    color: #7f1d1d;
    border-radius: 10px;
    text-align: center;
    font-weight: 500;
  }
</style>
</head>

<body>

<div class="wrapper">

  <h1>Exam Seating Details</h1>
  <div class="subtitle">Enter your Website ID to view your allocation</div>

  <div class="search">
    <input id="idInput" placeholder="Eg: 2024DA04386" oninput="this.value=this.value.toUpperCase()">
    <button onclick="search()">Search</button>
  </div>

  <div id="output"></div>

</div>

<script>
  const data = {
    "2024DA04386": {
      name: "N G R POOJITH VENKAT REDDY",
      system: "242",
      program: "CLUSTER",
      subprogram: "EC2 M Mid Sem",
      lab: "227",
      floor: "2nd"
    }
  };

  function search() {
    const id = document.getElementById("idInput").value.trim();
    const out = document.getElementById("output");

    if (!data[id]) {
      out.innerHTML = `<div class="error">❌ No seating details found</div>`;
      return;
    }

    const d = data[id];

    out.innerHTML = `
      <div class="details">
        <div class="student-name">👋 ${d.name}</div>

        <div class="line"><span>System Number</span><strong>${d.system}</strong></div>
        <div class="line"><span>Program</span><strong>${d.program}</strong></div>
        <div class="line"><span>Sub Program</span><strong>${d.subprogram}</strong></div>
        <div class="line"><span>Lab Number</span><strong>${d.lab}</strong></div>
        <div class="line"><span>Floor</span><strong>${d.floor} Floor</strong></div>

        <div class="highlight">
          📍 Please report to <strong>${d.floor} Floor, Lab ${d.lab}</strong>  
          and occupy <strong>System ${d.system}</strong>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
