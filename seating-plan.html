<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Exam Seating Arrangement</title>

<style>
  body {
    font-family: Inter, Arial, sans-serif;
    background: #ffffff;
    margin: 24px;
    color: #111827;
  }

  /* Header */
  .header {
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 600;
  }

  .meta {
    font-size: 13px;
    color: #6b7280;
    margin-top: 4px;
  }

  /* Seating grid */
  .seating-wrapper {
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 800px;
  }

  th, td {
    border: 1px solid #e5e7eb;
    padding: 8px;
    vertical-align: top;
  }

  th {
    background: #f9fafb;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }

  /* Seat cell */
  .seat {
    height: 90px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .seat-number {
    font-size: 11px;
    color: #6b7280;
  }

  .student-name {
    font-size: 14px;
    font-weight: 600;
  }

  .roll-number {
    font-size: 12px;
    color: #374151;
  }

  /* Seat states */
  .empty {
    background: #f3f4f6;
  }

  .blocked {
    background: #fef2f2;
  }

  td:hover {
    background: #f9fafb;
    cursor: pointer;
  }

  /* Legend */
  .legend {
    margin-top: 16px;
    font-size: 13px;
    display: flex;
    gap: 20px;
  }

  .legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .box {
    width: 14px;
    height: 14px;
    border: 1px solid #9ca3af;
  }

  .box.empty { background: #f3f4f6; }
  .box.blocked { background: #fef2f2; }
</style>
</head>

<body>

  <div class="header">
    <h1>Exam Seating Arrangement</h1>
    <div class="meta">
      Hall: A Block – Room 203 | Date: 12 Mar 2026 | Session: FN
    </div>
  </div>

  <div class="seating-wrapper">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>1</th>
          <th>2</th>
          <th>3</th>
          <th>4</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th>A</th>
          <td>
            <div class="seat">
              <div class="seat-number">A1</div>
              <div class="student-name">Keerthana K</div>
              <div class="roll-number">21CS045</div>
            </div>
          </td>
          <td class="empty"></td>
          <td>
            <div class="seat">
              <div class="seat-number">A3</div>
              <div class="student-name">Rahul S</div>
              <div class="roll-number">21CS052</div>
            </div>
          </td>
          <td class="blocked"></td>
        </tr>

        <tr>
          <th>B</th>
          <td>
            <div class="seat">
              <div class="seat-number">B1</div>
              <div class="student-name">Ananya M</div>
              <div class="roll-number">21CS061</div>
            </div>
          </td>
          <td class="empty"></td>
          <td>
            <div class="seat">
              <div class="seat-number">B3</div>
              <div class="student-name">Vikram R</div>
              <div class="roll-number">21CS074</div>
            </div>
          </td>
          <td class="empty"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="legend">
    <span><div class="box"></div> Assigned</span>
    <span><div class="box empty"></div> Empty</span>
    <span><div class="box blocked"></div> Blocked</span>
  </div>

</body>
</html>
