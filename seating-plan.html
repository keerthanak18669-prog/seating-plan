<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Seating Plan</title>

<style>
/* SHAKE ANIMATION */
@keyframes shake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

.shake {
  animation: shake 0.4s;
}

/* BASIC STYLES */
* {
  box-sizing: border-box;
  font-family: Book Antiqua, Helvetica, sans-serif;
}

body {
  margin: 0;
  background: #f1f3f6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: #1f3c88;
  color: white;
  text-align: center;
  padding: 12px;
}

header h1 {
  margin: 0;
  font-size: 18px;
}

header p {
  margin: 4px 0 0;
  font-size: 13px;
}

/* MAIN CARD */
.main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 30px 15px;
}

.card {
  background: white;
  width: 100%;
  max-width: 400px;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  text-align: center;
}

input {
  width: 100%;
  padding: 11px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #bbb;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 11px;
  font-size: 14px;
  border-radius: 6px;
  border: none;
  background: #1f3c88;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #162f6a;
}

#result {
  margin-top: 15px;
  font-size: 14px;
  line-height: 1.6;
}

/* FOOTER */
footer {
  text-align: center;
  font-size: 12px;
  color: #777;
  padding: 8px;
}
</style>
</head>

<body>

<header>
  <h1>MVJ College of Engineering (BITS-Examination)</h1>
  <p>Candidate Seating Plan Portal</p>
</header>

<div class="main">
  <div class="card">
    <h2>Search Candidate Details</h2>
    <p>Date: 03-01-2025 | Shift: FN</p>

    <input type="text" id="cid" placeholder="Enter Candidate ID">
    <button onclick="searchCandidate()">Search</button>

    <div id="result"></div>
  </div>
</div>

<footer>
  Powered by Keerthana and Team
</footer>

<script>
/* SAMPLE DATA */
const data = {
  "2024AD05055": {
    name: "ALOK KUMAR OJHA",
    system: "1",
    program: "CLUSTER",
    subprogram: "EC2 M Mid Sem",
    lab: "24A",
    floor: "Gnd"
  },
  "2024AD05056": {
    name: "RAHUL SHARMA",
    system: "5",
    program: "CLUSTER",
    subprogram: "EC2 M Mid Sem",
    lab: "24B",
    floor: "1st"
  }
};

/* SEARCH FUNCTION */
function searchCandidate() {
  const input = document.getElementById("cid");
  const cid = input.value.trim().toUpperCase();
  const result = document.getElementById("result");

  // reset animation
  result.classList.remove("shake");
  void result.offsetWidth; // force reflow
  result.innerHTML = "";

  if (cid === "") {
    result.innerHTML = `
      <span style="color:red;font-weight:bold;">
        ⚠️ Please enter Candidate ID
      </span>
    `;
    result.classList.add("shake");
    return;
  }

  if (!data[cid]) {
    result.innerHTML = `
      <span style="color:red;font-weight:bold;">
        😕 Candidate ID not found<br>
        Please check and try again
      </span>
    `;
    result.classList.add("shake");
    return;
  }

  const c = data[cid];

  result.innerHTML = `
    <b>Name:</b> ${c.name}<br>
    <b>System No:</b> ${c.system}<br>
    <b>Program:</b> ${c.program}<br>
    <b>Exam:</b> ${c.subprogram}<br>
    <b>Lab:</b> ${c.lab}<br>
    <b>Floor:</b> ${c.floor}<br><br>
    <span style="color:#1f3c88;font-weight:bold;">
      😎 All the best for the exam!🍀
    </span>
  `;
}
</script>

</body>
</html>
