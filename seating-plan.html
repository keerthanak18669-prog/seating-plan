<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Seating Info</title>

<style>
  body {
    margin: 0;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #f0f7ff, #ffffff);
    color: #1f2937;
  }

  .container {
    max-width: 720px;
    margin: 80px auto;
    padding: 0 20px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #1e40af;
    margin-bottom: 8px;
  }

  .header p {
    font-size: 15px;
    color: #475569;
  }

  /* Search box */
  .search-box {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 40px;
  }

  .search-box input {
    flex: 1;
    max-width: 360px;
    padding: 14px 16px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid #c7d2fe;
    outline: none;
    background: #ffffff;
  }

  .search-box input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .search-box button {
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 600;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .search-box button:hover {
    background: #1d4ed8;
  }

  /* Result section */
  .result {
    background: #ffffff;
    border-radius: 14px;
    padding: 24px 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  }

  .result h2 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #0f172a;
  }

  .info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 14px;
    column-gap: 30px;
    font-size: 15px;
  }

  .label {
    color: #64748b;
  }

  .value {
    font-weight: 600;
    color: #020617;
  }

  .highlight {
    grid-column: span 2;
    margin-top: 18px;
    padding: 14px;
    background: #f0fdf4;
    border-left: 5px solid #22c55e;
    border-radius: 8px;
    font-weight: 600;
    color: #166534;
  }

  .not-found {
    background: #fff1f2;
    border-left: 5px solid #ef4444;
    padding: 16px;
    border-radius: 10px;
    color: #7f1d1d;
    font-weight: 500;
  }
  .result-card {
  background: #ffffff;
  border-radius: 14px;
  padding: 24px 28px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  max-width: 640px;
}

.student-name {
  font-size: 18px;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 18px;
}

.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 32px;
  font-size: 15px;
}

.label {
  color: #64748b;
}

.value {
  font-weight: 600;
  color: #020617;
}

.highlight {
  margin-top: 20px;
  padding: 14px 16px;
  background: #f0fdf4;
  border-left: 5px solid #22c55e;
  border-radius: 8px;
  font-weight: 600;
  color: #166534;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Find Your Exam Seat</h1>
    <p>Enter your Website ID to instantly view your exam location</p>
  </div>

  <div class="search-box">
    <input type="text" id="websiteId" placeholder="Enter Website ID (eg: WEB20260045)">
    <button onclick="getDetails()">Search</button>
  </div>

  <div id="output"></div>

</div>

<script>
  const seatingData = {
   "2024CC21082": { name: "SANJANA M SHENDGE", system: "238", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd " },
"2025CA08015": { name: "MORTI ANJALI MAHESH", system: "239", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd " },
"2024DC04073": { name: "SINGUPURAM ATULYA", system: "240", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd " },
"2025AA05643": { name: "ADITYA KAINTHOLA", system: "241", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd " },
"2024DA04386": { name: "N G R POOJITH VENKAT REDDY", system: "242", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd " },

  function getDetails() {

      out.innerHTML = `

        </div>`;

    }

    const d = seatingData[id];

     <div class="result-card">

    <div class="label">Program</div>
    <div class="value">CLUSTER</div>

    <div class="label">Sub Program</div>
    <div class="value">EC2 M Mid Sem</div>

    <div class="label">Lab</div>
    <div class="value">Lab 227</div>

    <div class="label">Floor</div>
    <div class="value">2nd Floor</div>
  </div>

  <div class="highlight">
    📍 Please report to <strong>2nd Floor, Lab 227</strong> and check <strong>System No 242</strong>.
  </div>
</div>

    `;
  }
</script>

</body>
</html>
