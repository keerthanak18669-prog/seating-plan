    background: #f2f4f8;
    font-family: "Book Antiqua", Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    background: white;
    width: 90vw;

    padding: 28px 22px;
    border-radius: 14px;

    font-size: 20px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #bbb;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    background-color: #2e7d32;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  #result {
    margin-top: 18px;
    font-size: 16px;
    line-height: 1.6;

</style>
