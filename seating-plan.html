<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Seating Portal</title>

<style>
body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(180deg, #f2f7ff 0%, #ffffff 60%);
  color: #1f2937;
}


/* ===== Sticky Header ===== */
header {
  position: sticky;
  top: 0;
  background: linear-gradient(180deg, #ffffff, #f5f9ff);
  z-index: 100;
  border-bottom: 1px solid #dbeafe;
  padding: 14px 16px;
}


header h1 {
  margin: 0;
  font-size: 18px;
  text-align: center;
  color: #1e40af;
}

header h2 {
  margin: 4px 0 6px;
  font-size: 15px;
  text-align: center;
  color: #2563eb;
}

.meta {
  text-align: center;
  font-size: 13px;
  color: #475569;
}

/* ===== Layout ===== */
.wrapper {
  max-width: 480px;
  margin: auto;
  padding: 20px 16px 100px;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #64748b;
  margin-bottom: 20px;
}

/* ===== Search ===== */
.search {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.search input {
  flex: 1;
  padding: 14px;
  font-size: 14px;
  border-radius: 12px;
  border: 1.5px solid #c7d2fe;
  background: #ffffff;
}

.search button {
  padding: 14px 22px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  font-weight: 600;
}


/* ===== Result ===== */
.details {
  margin-top: 16px;
  background: #f8fbff;
  border-radius: 14px;
  padding: 16px;
}


.student-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
}

/* ===== Green Report Box ===== */
.report-box {
  margin-top: 18px;
  padding: 14px 16px;
  background: linear-gradient(180deg, #eaffea, #f1fff1);
  border-left: 5px solid #22c55e;
  border-radius: 12px;
  color: #166534;
  font-weight: 600;
  font-size: 14px;
}


/* ===== Error ===== */
.error {
  padding: 14px;
  background: #fff1f2;
  color: #7f1d1d;
  border-radius: 10px;
  text-align: center;
  font-weight: 500;
}

/* ===== Footer ===== */
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #f8fafc;
  border-top: 1px solid #e5e7eb;
  text-align: center;
  padding: 10px;
  font-size: 12px;
  color: #475569;
}
</style>
</head>

<body>

<header>
  <h1>MVJ College of Engineering (Bits Examination)</h1>
  <h2>Candidate Seating Plan</h2>
  <div class="meta">
    Date: <span id="currentDate"></span> |
    Shift: <span id="currentShift"></span>
  </div>
</header>

<div class="wrapper">
  <div class="subtitle">
    Enter your Candidate ID to view your exam seating details
  </div>

  <div class="search">
    <input id="idInput" placeholder="Enter Candidate ID"
      oninput="this.value=this.value.toUpperCase()">
    <button onclick="search()">Search</button>
  </div>

  <div id="output"></div>
</div>

<footer>
  Powered by Keerthana ©
</footer>

<script>
/* ======================
   DATE & SHIFT (FIXED)
====================== */
const now = new Date();

document.getElementById("currentDate").textContent =
  now.toLocaleDateString("en-GB");

const hour = now.getHours();
let shift = "FN";

if (hour >= 11 && hour < 15) shift = "AN";
else if (hour >= 15) shift = "EN";

document.getElementById("currentShift").textContent = shift;

/* ======================
   STUDENT DATA (SAMPLE)
====================== */
const data = {
  "2024AD05055": {
    name: "ALOK KUMAR OJHA",
    system: "1",
    lab: "10",
    floor: "Gnd",
    program: "CLUSTER",
    subprogram: "EC2 M Mid Sem"
  }
  // 👉 your full data continues (no change needed)
};

/* ======================
   SEARCH FUNCTION (FIXED)
====================== */
function search() {
  const id = document.getElementById("idInput").value.trim();
  const out = document.getElementById("output");
  out.innerHTML = "";

  if (!id) return;

  const s = data[id];

  if (!s) {
    out.innerHTML = `<div class="error">❌ Candidate ID not found</div>`;
    return;
  }

  out.innerHTML = `
    <div class="details">
      <div class="student-name">👋 ${s.name}</div>

      <div class="line"><span>System Number</span><strong>${s.system}</strong></div>
      <div class="line"><span>Lab Number</span><strong>${s.lab}</strong></div>
      <div class="line"><span>Floor</span><strong>${s.floor}</strong></div>
      <div class="line"><span>Program</span><strong>${s.program}</strong></div>
      <div class="line"><span>Sub Program</span><strong>${s.subprogram}</strong></div>

      <div class="report-box">
        📍 Please report to <strong>${s.floor}</strong>,
        <strong>Lab ${s.lab}</strong> and occupy
        <strong>System ${s.system}</strong>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
