<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Seat Allocation</title>

<style>
  body {
    margin: 0;
    font-family: "Inter", "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #eaf2ff, #fdfefe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1f2937;
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 28px 24px 30px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.08);
  }

  .title {
    text-align: center;
    margin-bottom: 24px;
  }

  .title h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1e40af;
    margin-bottom: 6px;
  }

  .title p {
    font-size: 14px;
    color: #64748b;
  }

  .search {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .search input {
    flex: 1;
    padding: 14px 14px;
    font-size: 14px;
    border-radius: 12px;
    border: 1px solid #c7d2fe;
    outline: none;
  }

  .search input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }

  .search button {
    padding: 14px 18px;
    font-size: 14px;
    font-weight: 600;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  .search button:hover {
    background: #1d4ed8;
  }

  .result {
    margin-top: 10px;
  }

  .card {
    background: #f8fafc;
    border-radius: 14px;
    padding: 18px 16px;
  }

  .name {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 10px;
  }

  .row span {
    color: #64748b;
  }

  .row strong {
    color: #020617;
  }

  .note {
    margin-top: 14px;
    padding: 12px;
    background: #ecfdf5;
    border-radius: 10px;
    font-size: 14px;
    color: #166534;
    font-weight: 600;
  }

  .error {
    background: #fff1f2;
    padding: 14px;
    border-radius: 12px;
    color: #7f1d1d;
    font-weight: 500;
    text-align: center;
  }
</style>
</head>

<body>

<div class="app">

  <div class="title">
    <h1>Exam Seat Allocation</h1>
    <p>Enter your Website ID to view your seat</p>
  </div>

  <div class="search">
    <input
      type="text"
      id="websiteId"
      placeholder="Eg: 2024DA04386"
      oninput="this.value=this.value.toUpperCase()"
    >
    <button onclick="getDetails()">Search</button>
  </div>

  <div class="result" id="output"></div>

</div>

<script>
  const seatingData = {
    "2024CC21082": { name: "SANJANA M SHENDGE", system: "238", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd" },
    "2025CA08015": { name: "MORTI ANJALI MAHESH", system: "239", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd" },
    "2024DC04073": { name: "SINGUPURAM ATULYA", system: "240", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd" },
    "2025AA05643": { name: "ADITYA KAINTHOLA", system: "241", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd" },
    "2024DA04386": { name: "N G R POOJITH VENKAT REDDY", system: "242", program: "CLUSTER", subprogram: "EC2 M Mid Sem", lab: "227", floor: "2nd" }
  };

  function getDetails() {
    const id = document.getElementById("websiteId").value.trim();
    const out = document.getElementById("output");

    if (!seatingData[id]) {
      out.innerHTML = `
        <div class="error">
          ❌ No seating details found
        </div>
      `;
      return;
    }

    const d = seatingData[id];

    out.innerHTML = `
      <div class="card">
        <div class="name">👋 ${d.name}</div>

        <div class="row"><span>System No</span><strong>${d.system}</strong></div>
        <div class="row"><span>Program</span><strong>${d.program}</strong></div>
        <div class="row"><span>Sub Program</span><strong>${d.subprogram}</strong></div>
        <div class="row"><span>Lab</span><strong>${d.lab}</strong></div>
        <div class="row"><span>Floor</span><strong>${d.floor} Floor</strong></div>

        <div class="note">
          📍 Report to <strong>${d.floor} Floor, Lab ${d.lab}</strong> and check
          <strong>System ${d.system}</strong>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
