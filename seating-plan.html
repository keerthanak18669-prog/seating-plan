<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Seating Details</title>

<style>
  body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: linear-gradient(180deg, #eef4ff, #ffffff);
    color: #1f2937;
  }

  /* ===== Sticky Header ===== */
  header {
    position: sticky;
    top: 0;
    background: #ffffff;
    z-index: 100;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 16px;
  }

  header h1 {
    margin: 0;
    font-size: 20px;
    color: #1e40af;
    text-align: center;
  }

  header h2 {
    margin: 4px 0 6px;
    font-size: 16px;
    text-align: center;
    color: #1e40af;
  }

  header .meta {
    text-align: center;
    font-size: 13px;
    color: #475569;
  }

  .wrapper {
    max-width: 480px;
    margin: auto;
    padding: 20px 16px 80px;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 20px;
  }

  .search {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .search input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #c7d2fe;
    font-size: 14px;
    outline: none;
  }

  .search button {
    padding: 14px 18px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  .details {
    margin-top: 12px;
  }

  .student-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .line {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
  }

  .line span {
    color: #6b7280;
  }

  .line strong {
    color: #020617;
  }

  .error {
    padding: 14px;
    background: #fff1f2;
    color: #7f1d1d;
    border-radius: 10px;
    text-align: center;
    font-weight: 500;
  }

  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #f8fafc;
    border-top: 1px solid #e5e7eb;
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: #475569;
  }
</style>
</head>

<body>

<header>
  <h1>MVJ College of Engineering</h1>
  <h2>Candidate Seating Plan</h2>
  <div class="meta">
    Date: <span id="currentDate"></span> | Shift: <span id="currentShift"></span>
  </div>
</header>

<div class="wrapper">
  <div class="subtitle">Enter your Candidate ID to view your allocation</div>

  <div class="search">
    <input id="idInput" placeholder="Eg: 2025AB00000" oninput="this.value=this.value.toUpperCase()">
    <button onclick="search()">Search</button>
  </div>

  <div id="output"></div>
</div>

<footer>
  Powered by Keerthana
</footer>

<script>
  /* ===== Auto Date ===== */
  const today = new Date();
  const formattedDate = today.toLocaleDateString("en-GB");
  document.getElementById("currentDate").textContent = formattedDate;

  /* ===== Auto Shift ===== */
  const hour = today.getHours();
  document.getElementById("currentShift").textContent = hour < 12 ? "FN" : "AN";

  /* ===== Student Data ===== */
  const data = {
    "2024AD05055": { name: "ALOK KUMAR OJHA", system: "1", lab: "10", floor: "Gnd", program: "CLUSTER", subprogram: "EC2 M Mid Sem" }
    // ⚠️ KEEP YOUR FULL DATA HERE (unchanged)
  };

  function search() {
    const id = document.getElementById("idInput").value.trim();
    const output = document.getElementById("output");

    if (!data[id]) {
      output.innerHTML = `<div class="error">No record found for this Candidate ID</div>`;
      return;
    }

    const s = data[id];

    output.innerHTML = `
      <div class="details">
        <div class="student-name">${s.name}</div>

        <div class="line"><span>Candidate ID</span><strong>${id}</strong></div>
        <div class="line"><span>Candidate Name</span><strong>${s.name}</strong></div>
        <div class="line"><span>System Number</span><strong>${s.system}</strong></div>
        <div class="line"><span>Lab Number</span><strong>${s.lab}</strong></div>
        <div class="line"><span>Floor</span><strong>${s.floor}</strong></div>
        <div class="line"><span>Program Name</span><strong>${s.program}</strong></div>
        <div class="line"><span>Sub-Program Name</span><strong>${s.subprogram}</strong></div>
      </div>
    `;
  }
</script>

</body>
</html>
