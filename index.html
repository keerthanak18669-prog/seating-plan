<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exam Seating Portal</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
}

header {
    background: #1e3a8a;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.result {
    margin-top: 15px;
    padding: 15px;
    background: #f9fafb;
    border-radius: 8px;
}

.error {
    color: red;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <h2>Exam Seating Portal</h2>
    <p>EXAM DATE - 3rd May 2026</p>
</header>

<div class="container">

    <input id="idInput" placeholder="Enter BITS ID">
    <button onclick="search()">Search</button>

    <div id="output"></div>

</div>

<script>

/* YOUR DATA FROM IMAGE */
const data = {

"2020WB15299": {
    name: "NAHEEDA M",
    floor: "Ground Floor",
    room: "LH 03"
},

"2021WA15443": {
    name: "DARLA SAI YAMINI SRI",
    floor: "Ground Floor",
    room: "LH 03"
},

"2021WA15611": {
    name: "PALLAVI PATIL",
    floor: "Ground Floor",
    room: "LH 03"
},

"2021WA15615": {
    name: "KANMANI V",
    floor: "Ground Floor",
    room: "LH 03"
},

"2021WA15684": {
    name: "ANKITA GHATAGE",
    floor: "Ground Floor",
    room: "LH 03"
}

};

/* SEARCH FUNCTION */
function search() {

    let id = document.getElementById("idInput").value.trim().toUpperCase();
    let out = document.getElementById("output");

    if (!id) {
        out.innerHTML = `<div class="error">Please enter BITS ID</div>`;
        return;
    }

    let s = data[id];

    if (!s) {
        out.innerHTML = `<div class="error">ID not found</div>`;
        return;
    }

    out.innerHTML = `
        <div class="result">
            <h3>${s.name}</h3>
            <p><strong>Floor:</strong> ${s.floor}</p>
            <p><strong>Room:</strong> ${s.room}</p>
        </div>
    `;
}

/* ENTER KEY SUPPORT */
document.getElementById("idInput").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        search();
    }
});

</script>

</body>
</html>
