```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candidate Seating Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Inter',sans-serif;
background:linear-gradient(180deg,#eef2ff,#ffffff);
color:#1f2937;
}

/* HEADER */

header{
background:white;
padding:18px;
text-align:center;
border-bottom:1px solid #e5e7eb;
box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

header h1{
margin:0;
font-size:20px;
color:#1e3a8a;
}

header h2{
margin:5px 0;
font-size:15px;
color:#2563eb;
}

.meta{
font-size:13px;
color:#6b7280;
}

/* MAIN */

.container{
max-width:480px;
margin:auto;
padding:30px 20px;
}

/* SEARCH CARD */

.search-card{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.search-title{
text-align:center;
font-size:15px;
color:#475569;
margin-bottom:20px;
}

.search-box{
display:flex;
gap:10px;
}

.search-box input{
flex:1;
padding:14px;
border-radius:10px;
border:1px solid #d1d5db;
font-size:14px;
}

.search-box input:focus{
outline:none;
border-color:#2563eb;
box-shadow:0 0 0 2px rgba(37,99,235,0.1);
}

.search-box button{
background:#2563eb;
color:white;
border:none;
padding:14px 20px;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.search-box button:hover{
background:#1d4ed8;
}

/* RESULT CARD */

.result{
margin-top:20px;
}

.details{
background:white;
border-radius:16px;
padding:20px;
box-shadow:0 8px 22px rgba(0,0,0,0.08);
}

.student-name{
font-size:18px;
font-weight:700;
margin-bottom:15px;
color:#111827;
}

.line{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #f1f5f9;
font-size:14px;
}

.report-box{
margin-top:18px;
padding:15px;
background:#ecfdf5;
border-left:5px solid #22c55e;
border-radius:10px;
color:#065f46;
font-weight:600;
font-size:14px;
}

/* ALERTS */

.warning{
background:#fff7ed;
color:#9a3412;
padding:14px;
border-radius:10px;
text-align:center;
}

.error{
background:#fee2e2;
color:#7f1d1d;
padding:14px;
border-radius:10px;
text-align:center;
}

/* FOOTER */

footer{
text-align:center;
padding:12px;
font-size:12px;
color:#64748b;
border-top:1px solid #e5e7eb;
margin-top:40px;
}

</style>
</head>

<body>

<header>
<h1>BITS Examination (Garden City University)</h1>
<h2>Candidate Seating Portal</h2>

<div class="meta">
Date: <span id="currentDate"></span> |
Shift: <span id="currentShift"></span>
</div>
</header>

<div class="container">

<div class="search-card">

<div class="search-title">
Enter your Candidate ID to view seating details
</div>

<div class="search-box">
<input id="idInput" placeholder="Eg: 2025AB00000" autofocus
oninput="this.value=this.value.toUpperCase()">

<button onclick="search()">Search</button>
</div>

</div>

<div id="output" class="result"></div>

</div>

<footer>
Powered by Keerthana ©
</footer>

<script>

/* DATE */

const now = new Date()

document.getElementById("currentDate").textContent =
now.toLocaleDateString("en-GB")

const hour = now.getHours()

let shift = "FN"

if(hour>=11 && hour<15) shift="AN"
else if(hour>=15) shift="EN"

document.getElementById("currentShift").textContent = shift


/* SAMPLE DATA */

const data = {

"2025CA30124":{
name:"RAJESHKANNA R",
system:"1",
lab:"1",
floor:"2",
Block:"Crystal",
program:"Comprehensive Exams",
subprogram:"Cluster"
},

"2024AD05018":{
name:"ARAVINTH T",
system:"2",
lab:"1",
floor:"2",
Block:"Crystal",
program:"Comprehensive Exams",
subprogram:"Cluster"
}

}


/* FLOOR FORMAT */

function getOrdinal(n){

n=parseInt(n)

if(n%100>=11 && n%100<=13) return n+"th"

switch(n%10){
case 1:return n+"st"
case 2:return n+"nd"
case 3:return n+"rd"
default:return n+"th"
}

}


/* SEARCH */

function search(){

const id=document.getElementById("idInput").value.trim()

const out=document.getElementById("output")

out.innerHTML=""

if(!id){

out.innerHTML=`<div class="warning">
⚠️ Please enter your Candidate ID
</div>`

return

}

const s=data[id]

if(!s){

out.innerHTML=`<div class="error">
❌ Candidate ID not found.<br>
Please enquire in media lab (west block)
</div>`

return

}

out.innerHTML=`

<div class="details">

<div class="student-name">👋 ${s.name}</div>

<div class="line"><span>System Number</span><strong>${s.system}</strong></div>

<div class="line"><span>Lab Number</span><strong>${s.lab}</strong></div>

<div class="line"><span>Floor</span><strong>${getOrdinal(s.floor)} Floor</strong></div>

<div class="line"><span>Block</span><strong>${s.Block}</strong></div>

<div class="line"><span>Program</span><strong>${s.program}</strong></div>

<div class="line"><span>Sub Program</span><strong>${s.subprogram}</strong></div>

<div class="report-box">

📍 Please Report to <strong>${s.Block} Block</strong>,
<strong>${getOrdinal(s.floor)} Floor</strong>,
<strong>Lab ${s.lab}</strong>,
<strong>System No. ${s.system}</strong>.

<br><br>

📸 Keep a screenshot and show it to the invigilator.

</div>

</div>

`

}

</script>

</body>
</html>
```
