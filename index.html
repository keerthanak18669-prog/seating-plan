```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Seating Portal</title>

<style>
body {
  margin: 0;
  font-family: Inter, "Book Antiqua", sans-serif;
  background: linear-gradient(180deg, #f2f7ff 0%, #ffffff 60%);
  color: #1f2937;
}

header {
  position: sticky;
  top: 0;
  background: linear-gradient(180deg, #ffffff, #f5f9ff);
  z-index: 100;
  border-bottom: 1px solid #dbeafe;
  padding: 14px 16px;
}

header h1 {
  margin: 0;
  font-size: clamp(14px, 4vw, 18px);
  text-align: center;
  color: #1e40af;
}

header h2 {
  margin: 4px 0 6px;
  font-size: 15px;
  text-align: center;
  color: #2563eb;
}

.meta {
  text-align: center;
  font-size: 13px;
  color: #475569;
}

.wrapper {
  max-width: 480px;
  margin: auto;
  padding: 20px 16px 120px;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #64748b;
  margin-bottom: 20px;
}

.search {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.search input {
  flex: 1;
  padding: 14px;
  font-size: 14px;
  border-radius: 12px;
  border: 1.5px solid #c7d2fe;
}

.search button {
  padding: 14px 22px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  font-weight: 600;
}

.warning {
  padding: 14px;
  background: #fff7ed;
  color: #9a3412;
  border-left: 5px solid #f97316;
  border-radius: 10px;
  font-size: 14px;
  text-align: center;
}

.details {
  margin-top: 16px;
  background: #f8fbff;
  border-radius: 14px;
  padding: 16px;
}

.student-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
}

.line {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #e2e8f0;
  font-size: 14px;
}

.report-box {
  margin-top: 18px;
  padding: 14px 16px;
  background: linear-gradient(180deg, #eaffea, #f1fff1);
  border-left: 5px solid #22c55e;
  border-radius: 12px;
  color: #166534;
  font-weight: 600;
  font-size: 14px;
}

.error {
  padding: 14px;
  background: #fff1f2;
  color: #7f1d1d;
  border-radius: 10px;
  text-align: center;
}

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #f8fafc;
  border-top: 1px solid #e5e7eb;
  text-align: center;
  padding: 10px;
  font-size: 12px;
  color: #475569;
}
</style>
</head>

<body>

<header>
<h1>BITS Examination (Garden City University)</h1>
<h2>Candidate Seating Portal</h2>
<div class="meta">
Date: <span id="currentDate"></span>
</div>
</header>

<div class="wrapper">

<div class="subtitle">
Enter your Candidate ID to view your exam seating details
</div>

<div class="search">
<input id="idInput" placeholder="eg:2025AB00000"
oninput="this.value=this.value.toUpperCase()">
<button onclick="search()">Search</button>
</div>

<div id="output"></div>

</div>

<footer>
Powered by Keerthana ©
</footer>

<script>

/* DATE */
const now = new Date();
document.getElementById("currentDate").textContent =
now.toLocaleDateString("en-GB");


/* DATA */

const data = {

FN:{
"2025CA30124":{"name":"RAJESHKANNA R","system":"1","lab":"1","floor":"2","Block":"Crystal"},
"2024AD05018":{"name":"ARAVINTH T","system":"2","lab":"1","floor":"2","Block":"Crystal"}
},

AN:{
"2024DC04104":{"name":"VANSHIKA TANEJA","system":"3","lab":"1","floor":"2","Block":"Crystal"}
},

EN:{
"2024DA04260":{"name":"BALDHA SHIVAM MAHESHBHAI","system":"4","lab":"1","floor":"2","Block":"Crystal"}
}

};


/* FLOOR FORMAT */

function getOrdinal(n){
n=parseInt(n);
if(n%100>=11 && n%100<=13) return n+"th";
switch(n%10){
case 1:return n+"st";
case 2:return n+"nd";
case 3:return n+"rd";
default:return n+"th";
}
}


/* SEARCH */

function search(){

const id=document.getElementById("idInput").value.trim();
const out=document.getElementById("output");

out.innerHTML="";

if(!id){
out.innerHTML=`<div class="warning">⚠️ Please enter your Candidate ID</div>`;
return;
}

let s=null;
let shiftFound="";

/* check FN */
if(data.FN[id]){
s=data.FN[id];
shiftFound="FN";
}

/* check AN */
else if(data.AN[id]){
s=data.AN[id];
shiftFound="AN";
}

/* check EN */
else if(data.EN[id]){
s=data.EN[id];
shiftFound="EN";
}

if(!s){
out.innerHTML=`<div class="error">❌ Candidate ID not found.<br>Please enquire in Media Lab (West Block)</div>`;
return;
}

out.innerHTML=`

<div class="details">

<div class="student-name">👋 ${s.name}</div>

<div class="line"><span>Shift</span><strong>${shiftFound}</strong></div>
<div class="line"><span>System Number</span><strong>${s.system}</strong></div>
<div class="line"><span>Lab Number</span><strong>${s.lab}</strong></div>
<div class="line"><span>Floor</span><strong>${getOrdinal(s.floor)} Floor</strong></div>
<div class="line"><span>Block</span><strong>${s.Block}</strong></div>

<div class="report-box">
📍 Please Report to <strong>${s.Block} Block</strong>,
<strong>${getOrdinal(s.floor)} Floor</strong>,
<strong>Lab ${s.lab}</strong>,
<strong>System No. ${s.system}</strong>.
<br><br>
📸 <strong>Note:</strong> Keep a screenshot of this page and show it to the invigilators when you report.
</div>

</div>

`;

}

</script>

</body>
</html>
```
