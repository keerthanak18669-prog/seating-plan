/* SEARCH FUNCTION */
function search() {

    let id = document.getElementById("idInput").value.trim().toUpperCase();
    let out = document.getElementById("output");

    if (!id) {
        out.innerHTML = `<div class="error">Please enter BITS ID</div>`;
        return;
    }

    let s = data[id];

    if (!s) {
        out.innerHTML = `<div class="error">ID not found</div>`;
        return;
    }

    out.innerHTML = `
    <div class="result">
        <h3>S No: ${s.sno}</h3>
        <h3>${s.name}</h3>
        <p><strong>Floor:</strong> ${s.floor}</p>
        <p><strong>Room:</strong> ${s.room}</p>
    </div>
`;
}

    if(e.key === "Enter"){
