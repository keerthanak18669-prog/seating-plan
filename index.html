<title>Candidate Seating Portal</title>

<style>
/*  CSS */
body {
  margin: 0;

header {

}
.meta {
  text-align: center;
  font-size: 13px;

}
.wrapper {
  max-width: 480px;
  margin: auto;
  padding: 20px 16px 120px;
}
.subtitle {
  text-align: center;
  font-size: 14px;
  color: #64748b;
  margin-bottom: 20px;
}
.search {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.search input {
  flex: 1;
  padding: 14px;
  font-size: 14px;
  border-radius: 12px;
  border: 1.5px solid #c7d2fe;
}
.search button {
  padding: 14px 22px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  font-weight: 600;
}
.warning {
  padding: 14px;
  background: #fff7ed;
  color: #9a3412;
  border-left: 5px solid #f97316;
  border-radius: 10px;
  font-size: 14px;
  text-align: center;
}
.details {
  margin-top: 16px;
  background: #f8fbff;
  border-radius: 14px;
  padding: 16px;
}
.student-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
}
.line {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #e2e8f0;
  font-size: 14px;
}
.report-box {
  margin-top: 18px;
  padding: 14px 16px;
  background: linear-gradient(180deg, #eaffea, #f1fff1);
  border-left: 5px solid #22c55e;
  border-radius: 12px;
  color: #166534;
  font-weight: 600;
  font-size: 14px;
}
.error {
  padding: 14px;
  background: #fff1f2;
  color: #7f1d1d;
  border-radius: 10px;
  text-align: center;
}
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #f8fafc;
  border-top: 1px solid #e5e7eb;
  text-align: center;
  padding: 10px;
  font-size: 12px;
  color: #475569;
}
</style>
</head>

/* ===== FLOOR FORMAT FUNCTION ===== */
function getOrdinal(n) {
  n = parseInt(n);
  if (n % 100 >= 11 && n % 100 <= 13) return n + "th";
  switch (n % 10) {
    case 1: return n + "st";
    case 2: return n + "nd";
    case 3: return n + "rd";
    default: return n + "th";
  }
}
